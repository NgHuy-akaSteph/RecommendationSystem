# Item-CF của RS với trọng số nhị phân relevant — biến thể tốt nhất trong sweep.
#
# Kết quả sweep 12 cấu hình (k ∈ {50,100,200,500} × weight_mode ∈ {rating, binary_pos,
# centered}) trên dev:
#
#   weight_mode   k=50    k=100   k=200   k=500
#   binary_pos    0,1263  0,1282  0,1297  0,1280
#   rating        0,1201  0,1215  0,1235  0,1224
#   centered      0,1207  0,1187  0,1126  0,1056
#
# NDCG@10 của binary_pos/k=200 khớp **tuyệt đối** với `cf-itemknn` của CB (0,129678) —
# xác nhận hai mô hình cùng thuật toán, chỉ khác cách biểu diễn. Đây là dòng dùng
# để so sánh với CF khác trong bảng chung.
exp_name: rs-itemcf-k200-binary-pos
model: rs-itemcf
params:
  k_neighbors: 200
  weight_mode: binary_pos
  normalize_sim: false
users: dev
k_list:
- 5
- 10
- 20
- 50
save_topk: false
