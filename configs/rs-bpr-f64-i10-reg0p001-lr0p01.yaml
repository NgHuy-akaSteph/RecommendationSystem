# BPR-MF: quét learning rate (i10, f64, reg=0.001). num_threads=1 để reproducible.
exp_name: rs-bpr-f64-i10-reg0p001-lr0p01
model: rs-bpr
params:
  factors: 64
  learning_rate: 0.01
  regularization: 0.001
  iterations: 10
  verify_negative_samples: true
  random_state: 42
  num_threads: 1
users: dev
k_list:
- 5
- 10
- 20
- 50
save_topk: false
