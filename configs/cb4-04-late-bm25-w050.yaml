      standardize: zscore
      threshold: 0.2
      scorer: item_knn
      weight_mode: binary_pos
      k_neighbors: 100
  weights:
  - 0.5
  - 0.5
users: dev
k_list:
- 5
- 10
- 20
- 50
save_topk: false
