exp_name: cb4-04-late-bm25-w050
model: cb4-hybrid
params:
  components:
  - model: cb2-bm25
    params:
      k1: 0.5
      b: 0.0
      min_df: 3
      max_df: 0.5
      max_features: 20000
      scorer: profile
